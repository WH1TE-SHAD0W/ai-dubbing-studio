name: ai-dubbing-studio

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Delivers translation jobs to the workers (ADR-0018). Only the queue lives
  # here; who owns a track is kept in Postgres by the API.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The Hono API: Better Auth logins, the API routes and the built PWA, on one
  # port (ADR-0007, ADR-0012). It also hands out translation tracks to the
  # workers (/internal). LiveKit and the dubbing container aren't wired yet.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-dubbing-studio-api
    environment:
      # Inside Compose, Postgres and Redis are reached by their service names.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (see .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env (see .env.example)}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /ready also checks that Postgres answers.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ready || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Translation workers (ADR-0018/0019/0020): each takes one job from the
  # stream, translates one language of one session, then exits and is started
  # fresh. Two replicas form the warm pool. Opt-in, because they need a Gemini
  # key: docker compose --profile translator up -d
  translator:
    profiles: ["translator"]
    build:
      context: apps/translator
    image: ai-dubbing-studio-translator
    deploy:
      replicas: ${TRANSLATOR_REPLICAS:-2}
    # Only what the worker needs: no database URL or login secrets.
    environment:
      REDIS_URL: redis://redis:6379
      # The API in Compose. When it runs on the host instead
      # (`pnpm --filter @ads/api dev`), set
      # TRANSLATOR_CONTROL_API_URL=http://host.docker.internal:3000 in .env.
      CONTROL_API_URL: ${TRANSLATOR_CONTROL_API_URL:-http://api:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env (see .env.example)}
      # Not marked required (`:?`): Compose would then demand it even when the
      # translator profile is off. Without it the worker exits with
      # "GEMINI_API_KEY is required" in its log.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-live-translate-preview}
      LOG_LEVEL: ${TRANSLATOR_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # WAV adapter while LiveKit is out of scope: input in media/in, output in media/out.
      - ./apps/translator/media:/media
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/translator", "-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    # A worker releases its track on SIGTERM; this is plenty of time.
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
