name: ai-dubbing-studio

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The Hono API: Better Auth logins, the API routes and the built PWA, on one
  # port (ADR-0007, ADR-0012). LiveKit and the dubbing container aren't wired yet.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-dubbing-studio-api
    environment:
      # Inside Compose, Postgres is reached by its service name.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (see .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /ready also checks that Postgres answers.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ready || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
