name: ai-dubbing-studio

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      # "key: secret", built from .env so the secret never goes in Git.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    # Only this machine by default. For a phone on your Wi-Fi, set LIVEKIT_BIND
    # to 0.0.0.0 and LIVEKIT_NODE_IP to this machine's LAN address in .env.
    ports:
      - "${LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7880"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The Hono API: Better Auth logins, the API routes and the built PWA, on one
  # port (ADR-0007, ADR-0012). It gets the LiveKit settings for the session rooms
  # (YGP-69); the translation workers aren't wired yet.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-dubbing-studio-api
    environment:
      # Inside Compose, Postgres is reached by its service name.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (see .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Inside Compose, LiveKit is reached by its service name (YGP-69).
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /ready also checks that Postgres answers.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ready || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
