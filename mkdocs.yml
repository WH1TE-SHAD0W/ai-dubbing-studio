site_name: AI Dubbing Studio
site_url: https://wh1te-shad0w.github.io/ai-dubbing-studio/
repo_url: https://github.com/WH1TE-SHAD0W/ai-dubbing-studio

theme:
  name: material

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture.md
      - Layers: architecture-layers.md
  - API: api.md
  - Branching Strategy: branching-strategy.md
  - Setup Guide: setup-guide.md
  - Deployment and runbook: deployment.md
  - Translator: translator.md
  - CI/CD: ci-cd.md
  - Testing: testing.md
  - User Guide: user-guide.md
  - Decisions (ADRs): adr/index.md
  - Writing the Docs: writing-docs.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
