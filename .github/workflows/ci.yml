# Checks the code on every pull request: typecheck, tests and build.
name: CI

on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]

# Read-only: these checks never write to the repo.
permissions:
  contents: read

# A new push to the same pull request cancels the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # --frozen-lockfile fails if pnpm-lock.yaml is out of date.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Which code may import which, in the worker and the API (YGP-110).
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Go version comes from go.mod, so CI and the Dockerfile match.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/translator/go.mod
          cache-dependency-path: apps/translator/go.sum
      - name: Worker rules (go-arch-lint)
        working-directory: apps/translator
        run: go run github.com/fe3dback/go-arch-lint@v1.19.1 check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API rules (dependency-cruiser)
        run: pnpm --filter @ads/api arch

  test:
    name: Test
    runs-on: ubuntu-latest
    # A throwaway Postgres for the API's database tests. Same version as Compose.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dubbing
          POSTGRES_DB: dubbing
          # No password: this database only exists inside the run.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dubbing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A throwaway LiveKit for the room tests (YGP-69). Same version as Compose.
      livekit:
        image: livekit/livekit-server:v1.13.11
        env:
          LIVEKIT_KEYS: "ci-key: ci-${{ github.run_id }}-${{ github.run_attempt }}-throwaway-livekit-secret"
        ports:
          - 7880:7880
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:7880"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without these the database and LiveKit tests are skipped, and the run
      # still passes.
      TEST_DATABASE_URL: postgres://dubbing@localhost:5432/dubbing
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: ci-key
      # Made from this run's ID, so it differs every run and only lives inside it.
      LIVEKIT_API_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-throwaway-livekit-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
