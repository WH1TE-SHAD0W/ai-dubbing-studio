# Security scan (YGP-78): builds the API and worker images and checks them
# for known vulnerabilities with Trivy. Nothing is pushed.
#
# - The check fails only on CRITICAL issues that already have a fix, so a
#   problem nobody can fix yet in a base image doesn't block every PR.
# - HIGH and CRITICAL issues are listed in the run's summary either way.
#
# Trivy runs from its official image, pinned to one version, instead of a
# third-party action. The same command works on a laptop (see docs/ci-cd.md).
name: Security

on:
  pull_request:
    branches: [development, testing, main]

permissions:
  contents: read

# A new push to the same pull request cancels the old run.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One image failing the scan doesn't stop the other from being scanned.
      fail-fast: false
      matrix:
        include:
          # Same build settings as images.yml, so the build cache is shared.
          - name: API image
            image: ai-dubbing-studio-api
            context: .
            file: apps/api/Dockerfile
            cache: api
          - name: Worker image
            image: ai-dubbing-studio-translator
            context: apps/translator
            file: apps/translator/Dockerfile
            cache: translator
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # load: true keeps the image on this machine so Trivy can read it.
      # It only reads the cache that images.yml writes.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache }}

      # The list of HIGH and CRITICAL issues, for people to read. Never fails.
      - name: List HIGH and CRITICAL issues
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --format table --no-progress \
            "scan/${{ matrix.image }}:${{ github.sha }}" > report.txt
          {
            echo "### ${{ matrix.name }}: HIGH and CRITICAL issues"
            echo "The check fails only on CRITICAL issues that have a fix."
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat report.txt

      # The check itself: exit code 1 if a fixable CRITICAL issue is found.
      # It reuses the vulnerability database the step above downloaded.
      - name: Fail on fixable CRITICAL issues
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-db-update --no-progress \
            "scan/${{ matrix.image }}:${{ github.sha }}"
