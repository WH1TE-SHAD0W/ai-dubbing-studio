# Builds the container images (YGP-52): the API (with the built PWA) and the
# translation worker. On a pull request it only builds them, to prove they
# still build. After a merge into testing or main it also pushes them to
# Docker Hub, tagged with the commit SHA plus "testing" or "prod". A
# release tag such as v0.1.0 pushes them with that version as well.
name: Images

on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [testing, main]
    tags: ["v*"]

permissions:
  contents: read

# A new push to the same branch or pull request cancels the old run.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One failing image doesn't stop the other from building.
      fail-fast: false
      matrix:
        include:
          # The API builds from the repo root: it needs the shared packages.
          - name: API image
            image: ai-dubbing-studio-api
            context: .
            file: apps/api/Dockerfile
            cache: api
          # The Go worker builds from its own folder, as in Docker Compose.
          - name: Worker image
            image: ai-dubbing-studio-translator
            context: apps/translator
            file: apps/translator/Dockerfile
            cache: translator
    env:
      # Set by an admin under Settings → Secrets and variables → Actions.
      # DOCKERHUB_TOKEN is an access token, never the account password.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Push only after a merge, and only when the Docker Hub secrets exist.
      - name: Decide whether to push
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN isn't set, so the image was built but not pushed."
            fi
          fi

      # The tags: the full commit SHA always, plus testing or prod by branch,
      # or the version for a release tag (v0.1.0 gives 0.1.0).
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/testing' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Pushes only if the whole build passed, so a failed build pushes nothing.
      - name: Build (and push after a merge)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
